name: Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pacman-contrib
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager || true

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Sync and Push to AUR
        run: |
          git config --global user.name "Bangkah"
          git config --global user.email "bangkah@aur.archlinux.org"

          # Clone repo AUR
          git clone ssh://aur@aur.archlinux.org/atha.git ../aur-atha
          cp PKGBUILD ../aur-atha/PKGBUILD
          cd ../aur-atha

          cat << 'EOF' > .SRCINFO
          pkgbase = atha
          	pkgdesc = Simple and fast Arch Linux package manager wrapper built on top of pacman
          	pkgver = 2.2.3
          	pkgrel = 1
          	url = https://github.com/Bangkah/Atha
          	arch = any
          	license = MIT
          	depends = bash
          	depends = pacman
          	depends = sudo
          	depends = git
          	depends = base-devel
          	source = atha.tar.gz::https://github.com/Bangkah/Atha/archive/refs/tags/v2.2.3.tar.gz
          	sha256sums = SKIP

          pkgname = atha
          EOF

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan berkas."
          else
            git commit -m "Update to ${{ github.ref_name }}"
            git push origin master
          fi