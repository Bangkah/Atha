name: Publish to AUR

on:
  push:
    tags:
      - 'v*'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Sync and Push to AUR
        run: |
          git config --global user.name "Bangkah"
          git config --global user.email "bangkah@aur.archlinux.org"

          git clone ssh://aur@aur.archlinux.org/atha.git ../aur-atha
          cp PKGBUILD ../aur-atha/PKGBUILD
          cd ../aur-atha

          echo "pkgbase = atha" > .SRCINFO
          echo "	pkgname = atha" >> .SRCINFO
          grep -E "^pkgver=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^pkgrel=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^pkgdesc=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^url=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^arch=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^license=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^depends=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^source=" PKGBUILD | sed 's/^/	/' >> .SRCINFO
          grep -E "^sha256sums=" PKGBUILD | sed 's/^/	/' >> .SRCINFO

          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan berkas."
          else
            git commit -m "Update to ${{ github.ref_name }}"
            git push origin master
          fi