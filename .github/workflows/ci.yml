name: CI (Test & Lint)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on Executable & Commands
        run: |
          echo "Linting main executable..."
          shellcheck -x -e SC1091 atha
          
          echo "Linting command modules..."
          find commands -name "*.sh" -print0 | xargs -0 shellcheck -x -e SC1091,SC2181